# Monthly usage-stats refresh (plan §5): pull the new Smogon chaos JSON,
# revalidate learnsets against it, commit the regenerated bundles.
# Fails loudly if Smogon hasn't published the month yet — rerun manually later
# via workflow_dispatch (optionally with an explicit MONTH).
name: data-refresh
on:
  schedule:
    - cron: '0 6 3 * *' # 06:00 UTC on the 3rd — Smogon stats usually land by the 2nd
  workflow_dispatch:
    inputs:
      month:
        description: 'Override month (YYYY-MM)'
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh usage stats
        run: npm run data:usage
        env:
          MONTH: ${{ inputs.month }}
      - name: Revalidate dex against new usage (fails on learnset gaps)
        run: npm run data:dex
      - run: npx vitest run
      - name: Commit updated data
        run: |
          git config user.name "data-refresh[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "data: monthly usage refresh"
          git push
